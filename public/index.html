<!DOCTYPE html>
<html lang="en">

<head>
  <% const PUBLIC_URL = typeof VUE_APP_PUBLIC_URL !== 'undefined' ? VUE_APP_PUBLIC_URL : ''; %>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta name="description" content="Explore the Orion Nebula through eleven telescopes, from a backyard camera to Webb, with its proplyds and JuMBOs marked on the sky. Powered by WorldWide Telescope.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Orion Nebula Explorer">
  <meta property="og:description"
    content="Explore the Orion Nebula through eleven telescopes, from a backyard camera to Webb, with its proplyds and JuMBOs marked on the sky. Powered by WorldWide Telescope.">
  <meta property="og:site_name" content="Orion Nebula Explorer">
  <!-- Social crawlers need an absolute image URL: set VUE_APP_PUBLIC_URL at
       build time (see README). Without it this falls back to a relative path. -->
  <meta property="og:image" content="<%= PUBLIC_URL %>preview.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="955">
  <meta property="og:image:alt" content="Orion Nebula explorer preview">
  <% if (PUBLIC_URL) { %><meta property="og:url" content="<%= PUBLIC_URL %>"><% } %>
  <link rel="icon" href="favicon.ico">
  <title>Orion Nebula Explorer</title>
</head>

<body>
  <noscript>
    <strong>WorldWide Telescope requires JavaScript to run.</strong>
  </noscript>
  <div id="app"></div>
  <!-- built files will be auto injected -->
</body>

</html>
